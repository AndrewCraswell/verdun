packages:
  - "apps/*"
  - "packages/*"
engineStrict: true
verifyDepsBeforeRun: error
# Versions locked once for the whole monorepo. Reference them with "catalog:".
catalog:
  "@babylonjs/addons": 9.30.0
  "@babylonjs/core": 9.30.0
  "@babylonjs/inspector": 9.30.0
  "@babylonjs/loaders": 9.30.0
  "@colyseus/core": 0.18.18
  "@colyseus/sdk": 0.18.5
  "@colyseus/ws-transport": 0.18.4
  "@dimforge/rapier3d-compat": 0.21.0
  "@fontsource-variable/archivo": 5.3.0
  "@fontsource-variable/bodoni-moda": 5.3.0
  "@types/node": 24.19.0
  "@vitest/coverage-v8": 5.0.3
  astronomy-engine: 2.1.19
  bitecs: 0.4.0
  fflate: 0.8.3
  msgpackr: 2.1.0
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.3
allowBuilds:
  lefthook: true
  # msgpackr's optional native speed-up, which Colyseus's messages need not: msgpackr runs as plain JavaScript without it.
  msgpackr-extract: false
