# Lefthook manages Git hooks for this monorepo.
# Docs: https://lefthook.dev
# Hooks are installed automatically via the root "prepare" script (lefthook install).

pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lockfile:
      # Installs on a VPN go through a corporate npm mirror; make the lockfile installable from public npm in CI.
      glob: "pnpm-lock.yaml"
      # Then resync node_modules, or pnpm's verifyDepsBeforeRun rejects the next pnpm command (such as pre-push).
      run: pnpm lockfile:normalize && pnpm install --frozen-lockfile --prefer-offline
      stage_fixed: true
    format:
      glob: "*.{js,jsx,ts,tsx,json,css,yaml,yml,md}"
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  commands:
    types:
      run: pnpm run check:types
