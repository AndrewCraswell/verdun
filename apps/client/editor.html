<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sector editor</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(20, 18, 15, 0.88);
        --line: rgba(220, 200, 160, 0.18);
        --text: #e8e0d0;
        --muted: #a89f8c;
        --accent: #d9b56c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14120f;
        color: var(--text);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #battlefield {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 260px;
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      #panel h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
      }
      #panel .muted {
        color: var(--muted);
      }
      #panel section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      #panel h2 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }
      #panel label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      #panel input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
      }
      #panel select {
        flex: 1;
        background: #221f1a;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="battlefield"></canvas>
    <div id="panel">
      <h1 id="sector-name">Sector editor</h1>
      <div id="status" class="muted">Loading</div>
      <section>
        <h2>Overlay</h2>
        <label
          >Map
          <select id="overlay-layer"></select
        ></label>
        <label>Opacity <input id="overlay-opacity" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
      </section>
      <section class="muted">
        Hold the right button to look round and fly with WASD, Q and E down and up, Shift faster, the wheel for speed.
        Middle-drag to pan, Alt and left-drag to orbit, the wheel to zoom where you point, F to frame the sector. Saving
        the sector in Tiled rebuilds it here.
      </section>
    </div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
