version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Node's types follow the Node that runs Verdun (.nvmrc), so a new major comes with moving Node, not before.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # One PR for routine minor/patch bumps to keep noise down.
      dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
