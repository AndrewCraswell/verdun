name: CI

on:
  push:
    branches: [main]
  pull_request:

# On main, runs queue rather than cancel each other: one at a time, the newest waiting, so a busy day still deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The level kit and the soundtrack are in Git LFS (.gitattributes). The cache keeps their objects, so they're
      # downloaded only when they change.
      - name: List the LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: ${{ runner.os }}-lfs-
      - name: Fetch the level kit and the soundtrack
        run: git lfs pull
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      # Builds with the real level, not the greybox: an encrypted pack under a fresh key, as a deploy would.
      - name: Pack the level kit
        run: pnpm assets:pack
      - run: pnpm verify
      # Every push to main that passes goes live: the client just built, served by Caddy (deploy/), on Railway. Needs
      # the RAILWAY_TOKEN secret, a project token for the verdun project's production environment.
      - name: Deploy to Railway
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "No RAILWAY_TOKEN secret, so no deploy"
            exit 0
          fi
          cp -r apps/client/dist deploy/site
          npx --yes @railway/cli@5 up deploy --path-as-root --no-gitignore --service client --environment production --ci --message "${GITHUB_SHA::7}"
