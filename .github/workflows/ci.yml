name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On main, runs queue rather than cancel each other: one at a time, the newest waiting, so a busy day still deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The shared pipelines' verify (betterapps-hq/pipelines, github/README.md), whose check is "verify / Verify
  # (ubuntu-latest)". The level kit and the soundtrack are in Git LFS (.gitattributes); it fetches them, cached until one
  # changes. Pnpm is package.json's packageManager and Node is .nvmrc's.
  verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@ed34ffcba2ef6748b0210c763582e8995c81501b # v1.6.0
    with:
      lfs: true
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      # Builds with the real level, not the greybox: an encrypted pack under a fresh key, as a deploy would.
      prepare: pnpm assets:pack
      # The live game is built to play multiplayer on the sector server deployed beside it (settings/mode.ts).
      env: |
        VERDUN_SERVER=wss://server-production-ff62.up.railway.app

  # Every push to main that passes goes live: the client, served by Caddy (deploy/), and the sector server
  # (deploy/server/), on Railway. It builds the client again, as verify's build stays in its own job, from the same
  # commit and settings. Needs the RAILWAY_TOKEN secret, a project token for the verdun project's production
  # environment.
  deploy:
    name: Deploy to Railway
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@0b0ed2e646a72e6db61a303cee36127aa5e17a48 # v1.3.1
        with:
          lfs: true
      - name: Pack the level kit
        run: pnpm assets:pack
      - name: Build the client
        run: pnpm build
        env:
          VERDUN_SERVER: wss://server-production-ff62.up.railway.app
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "No RAILWAY_TOKEN secret, so no deploy"
            exit 0
          fi
          cp -r apps/client/dist deploy/site
          npx --yes @railway/cli@5 up deploy --path-as-root --no-gitignore --service client --environment production --ci --message "${GITHUB_SHA::7}"
          bash deploy/server/assemble.sh
          npx --yes @railway/cli@5 up deploy/server/context --path-as-root --no-gitignore --service server --environment production --ci --message "${GITHUB_SHA::7}"
